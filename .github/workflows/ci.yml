name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  python-syntax:
    name: Python 语法与依赖
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 编译检查（不安装重型依赖）
        run: |
          python -m compileall -q algorithm
          echo "algorithm 目录语法检查通过"

  python-tests:
    name: 算法单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装轻量依赖并运行单元测试
        # 被测模块（保形预测 / 质量门禁 / 解释质量 / 特征工程）顶层只依赖
        # numpy、pandas、scipy，无需安装 lightgbm、shap 等重型依赖，秒级完成。
        run: |
          python -m pip install --quiet numpy pandas scipy pytest
          python -m pytest algorithm/tests -q

  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn test
        working-directory: backend
        # 需要 MySQL / Redis 的集成用例在 CI 环境不可用，此处仅跑不依赖外部中间件的用例；
        # 本地完整回归请直接执行 mvn test（含 16 个用例）。
        run: mvn -B -Dtest='RestResponseTest,PythonCliRunnerTest' test

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm ci && build
        working-directory: frontend
        run: |
          npm ci --registry=https://registry.npmmirror.com
          npm run build