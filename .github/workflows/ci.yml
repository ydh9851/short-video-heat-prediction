name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  python-syntax:
    name: Python 语法与依赖
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 编译检查（不安装重型依赖）
        run: |
          python -m compileall -q algorithm
          echo "algorithm 目录语法检查通过"

  python-tests:
    name: 算法单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装轻量依赖并运行单元测试
        # 被测模块（保形预测 / 质量门禁 / 解释质量 / 特征工程）顶层只依赖
        # numpy、pandas、scipy，无需安装 lightgbm、shap 等重型依赖，秒级完成。
        run: |
          python -m pip install --quiet numpy pandas scipy pytest
          python -m pytest algorithm/tests -q

  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn test
        working-directory: backend
        # 需要 MySQL / Redis 的集成用例在 CI 环境不可用，此处仅跑不依赖外部中间件的用例；
        # 本地完整回归请直接执行 mvn test（含 16 个用例）。
        run: mvn -B -Dtest='RestResponseTest,PythonCliRunnerTest' test

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm ci && build
        working-directory: frontend
        run: |
          npm ci --registry=https://registry.npmmirror.com
          npm run build

  evaluation-smoke:
    name: 评估冒烟（指标不回归）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装算法依赖
        # 交叉验证需要 LightGBM 与 scikit-learn；此处不装 SHAP 等仅归因分析用到的包。
        run: |
          python -m pip install --quiet numpy pandas scipy scikit-learn lightgbm matplotlib
      - name: 核心指标冒烟检查
        # 单元测试只能证明代码没写错，证明不了模型突然变差。
        # 这里跑一次轻量交叉验证并对关键指标设阈值，
        # 依赖升级、特征口径调整、数据文件替换导致的指标下滑会直接让流水线失败。
        run: python algorithm/evaluation/smoke_check.py --folds 3