# 测试环境配置模板（凭据同样走环境变量，不入库）
spring:
  redis:
    host: ${REDIS_HOST:localhost}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/short_video_heat_db?useSSL=false&useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&allowMultiQueries=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  path: ${LOG_PATH:./log/}