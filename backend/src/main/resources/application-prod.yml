# 生产环境配置模板
# 说明：所有敏感项均从环境变量注入，仓库内不保留任何真实凭据。
#   DB_URL / DB_USERNAME / DB_PASSWORD / REDIS_HOST
spring:
  redis:
    host: ${REDIS_HOST:localhost}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/short_video_heat_db?useSSL=false&useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&allowMultiQueries=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  path: ${LOG_PATH:./log/}