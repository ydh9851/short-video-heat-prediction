server:
  port: 8000
  servlet:
    session:
      cookie:
        # 降低跨站携带会话 Cookie 的风险；前后端同源部署时保持 lax 即可
        same-site: lax
  undertow:
    io-threads: 16
    worker-threads: 40
    buffer-size: 1024
    direct-buffers: true
  compression:
    enabled: true
    min-response-size: 1

# 可观测性：暴露健康检查、指标与 Prometheus 抓取端点（仅本机演示，生产需鉴权）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: short-video-heat-prediction

#logging logback
logging:
  config: classpath:logback-spring.xml
  file:
    name: exam

#mybatis
#mybatis:
#  mapper-locations: classpath:/mapper/*.xml
#  configuration:
 #   log-prefix: repository.
mybatis-plus:
  mapper-locations: classpath:mapper/**/*Mapper.xml
  type-aliases-package: com.alvis.media.domain.**
  configuration:
    cache-enabled: false
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true
      column-like: true


system:
  # 跨域白名单：生产环境必须通过环境变量 CORS_ALLOWED_ORIGINS 显式配置，禁止使用 "*"
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8002,http://127.0.0.1:8002}
  # 仅放行登录/登出、健康检查与接口文档；业务接口默认要求登录
  security-ignore-urls:
    - /api/user/login
    - /api/user/logout
    - /actuator/health
    - /actuator/info
    # 报告分享链接：token 即凭证，免登录只读访问
    - /api/report/shared/**
    # 接口文档（Swagger UI 与 OpenAPI JSON）
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /webjars/**
  # 注：密码已改为 BCrypt 单向哈希存储（见 PasswordConfig），不再需要 RSA 密钥对；
  # system.pwdKey 仅保留给仍使用 RsaUtil 的历史工具类，不参与登录流程。
  pwdKey:
    publicKey: ${RSA_PUBLIC_KEY:}
    privateKey: ${RSA_PRIVATE_KEY:}
  wx:
    # 微信小程序凭据（模板遗留，本项目未使用小程序端）；如需启用请用环境变量注入
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    token-to-live: 12h   #token 过期时间
    security-ignore-urls:
      - /api/wx/student/auth/bind
      - /api/wx/student/auth/checkBind
      - /api/wx/student/user/register



#mybatis page helper
pagehelper:
  autoDialect: true
  closeConn: true
  reasonable: true


#mybatis datasource default HikariPool
spring:
  # Flyway 数据库版本管理：启动时自动应用 db/migration 下未执行的脚本（幂等）。
  # baseline-on-migrate：对已有数据的库以 V1 为基线，跳过 V1、只补跑 V2+ 增量。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history
  # 在线接口文档：Swagger UI（/swagger-ui.html）与 OpenAPI JSON（/v3/api-docs）
  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      tags-sorter: alpha
      operations-sorter: alpha
    info:
      title: 短视频热度预测与归因分析系统 API
      version: 1.0.0
      description: |
        覆盖热度预测、热度分级、可解释归因、17 类可复现实验、数据治理与模型治理六组能力。
        所有响应统一为 { code, message, response } 三字段结构，响应头携带 X-Trace-Id 便于日志定位。

  servlet:
    multipart:
      # 文件最大限制
      max-file-size: 1024MB
      # 请求最大限制
      max-request-size: 1024MB
      enabled: true
      # 设置文件缓存的临界点,超过则先保存到临时目录,默认为0,所有文件都会进行缓存
      file-size-threshold: 0
  session:
    store-type: redis
  datasource:
    hikari:
      idle-timeout: 600000  #10 min
      max-lifetime: 1800000 #30 min
  data:
    redis:
      timeout: 10000 #超时时间
      database: 0 #0-15 16个库 默认0
      lettuce:
        pool:
          max-active: 8 #最大连接数
          max-wait: -1 #默认-1 最大连接阻塞等待时间
          max-idle: 8 #最大空闲连接 默认8
          min-idle: 0 #最小空闲连接
  cache:
    type: redis
    redis:
      time-to-live: 12h   #12 hour


  #runningtime environment
  profiles:
    active:  dev
