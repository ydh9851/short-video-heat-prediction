

logging:
  file:
    path: ./log/

spring:
  data:
    redis:
      host: 127.0.0.1
  datasource:
    url: jdbc:mysql://localhost:3306/short_video_heat_db?useSSL=false&useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

system:
  python:
    # 本系统虚拟环境与算法引擎（同构改造自课程项目 movie-system，工程自包含）
    # 注意：以下路径均为相对路径，以「backend 目录」为工作目录解析
    # （IDE 点运行 / 在 backend 下执行 java -jar / mvn spring-boot:run 均满足）。
    # 因此把整个 short-video-heat-prediction 目录拷贝到任何机器、任何盘符都无需改动本配置。
    path: '../.venv/Scripts/python.exe'
    predictScript: '../algorithm/prediction/predict_api.py'
    attributionScript: '../algorithm/attribution/shap_analysis.py'
    gradingScript: '../algorithm/grading/grade_cluster.py'
    # 模型评估与实验分析脚本（交叉验证 / 超参数搜索 / 学习曲线 / 消融 / 残差等）
    evaluationScript: '../algorithm/evaluation/model_evaluation.py'
    # 预测区间（LightGBM 分位数回归 P10/P50/P90）
    quantileScript: '../algorithm/prediction/quantile_predict.py'
    # 热度增长曲线预测（TikTok 第 0~30 天真实累计快照）
    growthScript: '../algorithm/prediction/growth_predict.py'
    # 多平台数据集导入器（把 data/raw 下各平台原始文件归一化为统一 schema）
    ingestScript: '../algorithm/datasets/ingest.py'
  eda:
    # Python 离线 EDA 图输出目录，通过 /eda/** 暴露给前端「特征探索分析」页面
    dir: '../algorithm/FeatureEDA/figures'
  attribution:
    # 归因分析图输出目录，通过 /attribution/** 暴露给前端「归因分析」页面
    dir: '../algorithm/attribution/figures'
  grading:
    # 热度分级图输出目录，通过 /grading/** 暴露给前端「热度分级」页面
    dir: '../algorithm/grading/figures'
  evaluation:
    # 模型评估实验图输出目录，通过 /evaluation/** 暴露给前端「模型评估」页面
    dir: '../algorithm/evaluation/figures'
  data:
    # 规范化数据集（preprocess.py 产出），供「数据管理」页面读取总览与样本预览
    processed: '../data/processed/train_clean.csv'
    # 各平台归一化产物目录（ingest.py 产出 <platform>_clean.csv）
    processedDir: '../data/processed'
    # 多平台数据集注册表（记录各平台样本量、类别数、时间跨度等信息）
    registry: '../data/processed/dataset_registry.json'
