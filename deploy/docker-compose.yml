# 一键启动整套系统：MySQL + Redis + 算法引擎 + 后端
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# 启动后访问 http://127.0.0.1:8000/admin/index.html
#
# 四个服务的启动顺序由 healthcheck 保证：
#   MySQL / Redis 就绪 → 引擎健康 → 后端启动
# 因此不会出现"后端先连库失败"或"引擎还没起就收到推理请求"。

name: short-video-heat

services:
  mysql:
    image: mysql:8.4
    container_name: heat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-short_video_heat_db}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动时自动执行：建库、建表与种子数据
      - ../sql/short_video_heat_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../sql/migration_heat_predict_log.sql:/docker-entrypoint-initdb.d/02-migration.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: heat-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.engine
    image: heat-engine:latest
    container_name: heat-engine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 模型缓存与实验台账落盘，容器重建不丢历史
      - engine-cache:/app/algorithm/prediction/model_cache
      - engine-logs:/app/data/logs

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: heat-backend:latest
    container_name: heat-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-short_video_heat_db}?useSSL=false&useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&allowMultiQueries=true
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      # 常驻推理服务地址：指向 engine 容器，容器内不走 127.0.0.1
      ENGINE_SERVICE_URL: http://engine:8100
      LOG_PATH: /app/backend/log/
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-logs:/app/backend/log
      - backend-data:/app/data

volumes:
  mysql-data:
  redis-data:
  engine-cache:
  engine-logs:
  backend-logs:
  backend-data: